name: CI

# Run on every push and on pull requests.
on:
  push:
  pull_request:

# Allow the job to read the code and push images to GitHub Container Registry.
permissions:
  contents: read
  packages: write

env:
  # Registry image name.
  IMAGE: ghcr.io/andmanousakis/stock-extreme

jobs:
  test-and-push:
    runs-on: ubuntu-24.04
    steps:
      # Get the repository code.
      - name: Checkout
        uses: actions/checkout@v4

      # Build the dev image, same as `make stock-extreme-dev-build-up`.
      - name: Build stock-extreme:dev image
        run: docker build -f docker/Dockerfile.dev -t stock-extreme:dev .

      # Run unit and integration tests inside the image.
      - name: Run tests
        run: docker run --rm stock-extreme:dev python -m pytest -v -p no:cacheprovider

      # Log in to GitHub Container Registry, only for pushes to dev.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push the tested image as :dev (latest dev) and :<commit sha> (exact version), only for pushes to dev.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          docker tag stock-extreme:dev $IMAGE:dev
          docker tag stock-extreme:dev $IMAGE:${{ github.sha }}
          docker push $IMAGE:dev
          docker push $IMAGE:${{ github.sha }}
