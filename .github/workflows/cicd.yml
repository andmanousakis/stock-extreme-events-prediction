name: CI/CD

# Run on every push and on pull requests.
on:
  push:
  pull_request:

# Allow jobs to read the code and push/pull images on GitHub Container Registry.
permissions:
  contents: read
  packages: write

env:
  # Registry image name.
  IMAGE: ghcr.io/andmanousakis/stock-extreme
  # Target environment from the branch: prod and uat branches map to themselves, every other branch to dev.
  APP_ENV: ${{ github.ref_name == 'prod' && 'prod' || github.ref_name == 'uat' && 'uat' || 'dev' }}

jobs:
  # CI: build the image and run the unit tests. Runs on every push and pull request.
  ci:
    runs-on: ubuntu-24.04
    steps:
      # Get the repository code.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Set up Docker Buildx so image layers can be cached between jobs and runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Build the image and load it into Docker, caching layers for the cd job.
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/deploy/Dockerfile
          tags: stock-extreme:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the unit tests inside the image with the target environment's configs.
      - name: Run unit tests
        run: docker run --rm -e APP_ENV=${{ env.APP_ENV }} stock-extreme:${{ github.sha }} python -m pytest -v -p no:cacheprovider -m "not integration"

  # CD: publish the image to GitHub Container Registry. Only for pushes, after CI passes.
  cd:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      # Get the repository code.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Set up Docker Buildx to reuse the layers cached by the CI job.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the image as :<environment> (latest for dev, uat or prod) and :<commit sha> (exact version).
      - name: Push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/deploy/Dockerfile
          tags: |
            ${{ env.IMAGE }}:${{ env.APP_ENV }}
            ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha

  # Integration tests: pull the published image and run the integration tests against real services.
  integration:
    needs: cd
    runs-on: ubuntu-24.04
    steps:
      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run the integration tests inside the exact image CD published, with the target environment's configs.
      - name: Run integration tests
        run: docker run --rm -e APP_ENV=${{ env.APP_ENV }} ${{ env.IMAGE }}:${{ github.sha }} python -m pytest -v -p no:cacheprovider -m integration

  # Data retrieval: run the pipeline in the published image and keep the data as a GitHub release.
  retrieve:
    needs: integration
    runs-on: ubuntu-24.04
    # Allow creating releases and pulling the image.
    permissions:
      contents: write
      packages: read
    steps:
      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run data retrieval with the target environment's configs, writing data/ and logs/ to the runner through mounted folders.
      - name: Run data retrieval
        run: |
          mkdir -p data logs
          docker run --rm -e APP_ENV=${{ env.APP_ENV }} -u $(id -u):$(id -g) -v "$PWD/data":/app/data -v "$PWD/logs":/app/logs ${{ env.IMAGE }}:${{ github.sha }} python -m src.1_data_retrieval

      # Publish the raw data and log as a release tagged data-<environment>-<date>-<short sha>.
      - name: Create data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="data-${APP_ENV}-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          gh release create "$TAG" data/raw/apple_stock_raw.xlsx logs/pipeline.log \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Raw data $TAG" \
            --notes "Raw AAPL prices for ${APP_ENV}, retrieved by commit ${{ github.sha }} on branch ${{ github.ref_name }}."
