name: CI/CD

# Run manually from the Actions tab; the chosen branch sets the environment.
on:
  workflow_dispatch:

# Allow jobs to read the code and push/pull images on GitHub Container Registry.
permissions:
  contents: read
  packages: write

env:
  # Registry image name.
  IMAGE: ghcr.io/andmanousakis/stock-extreme
  # Target environment from the branch: prod and uat branches map to themselves, every other branch to dev.
  APP_ENV: ${{ github.ref_name == 'prod' && 'prod' || github.ref_name == 'uat' && 'uat' || 'dev' }}
  # Pipeline run ID written to the metrics and predictions tables: run number and attempt.
  PIPELINE_RUN_ID: r${{ github.run_number }}.${{ github.run_attempt }}
  # Table storage (DagsHub), used by every pipeline job.
  STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
  AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # CI: build the image and run the unit tests.
  ci:
    runs-on: ubuntu-24.04
    steps:
      # Get the repository code.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Set up Docker Buildx so image layers can be cached between jobs and runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Build the image and load it into Docker, caching layers for the cd job.
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/deploy/Dockerfile
          tags: stock-extreme:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the unit tests inside the image with the target environment's configs.
      - name: Run unit tests
        run: docker run --rm -e APP_ENV=${{ env.APP_ENV }} stock-extreme:${{ github.sha }} python -m pytest -v -p no:cacheprovider -m "not integration"

  # CD: publish the image to GitHub Container Registry, after CI passes.
  cd:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      # Get the repository code.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Set up Docker Buildx to reuse the layers cached by the CI job.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the image as :<environment> (latest for dev, uat or prod) and :<commit sha> (exact version).
      - name: Push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/deploy/Dockerfile
          tags: |
            ${{ env.IMAGE }}:${{ env.APP_ENV }}
            ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha

  # Integration tests: pull the published image and run the integration tests against real services.
  integration:
    needs: cd
    runs-on: ubuntu-24.04
    steps:
      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run the integration tests inside the exact image CD published, with the target environment's configs.
      - name: Run integration tests
        run: docker run --rm -e APP_ENV=${{ env.APP_ENV }} ${{ env.IMAGE }}:${{ github.sha }} python -m pytest -v -p no:cacheprovider -m integration

  # Data retrieval: write the raw data table and create the run's GitHub release for logs and models.
  retrieve:
    needs: integration
    runs-on: ubuntu-24.04
    # Allow creating releases and pulling the image.
    permissions:
      contents: write
      packages: read
    # Pass the release tag to the later jobs.
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run data retrieval with the target environment's configs and the storage credentials, writing tables to storage and logs/ to the runner.
      - name: Run data retrieval
        run: |
          mkdir -p data logs
          docker run --rm -e APP_ENV=${{ env.APP_ENV }} -e STORAGE_BUCKET -e AWS_ENDPOINT_URL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION -u $(id -u):$(id -g) -v "$PWD/data":/app/data -v "$PWD/logs":/app/logs ${{ env.IMAGE }}:${{ github.sha }} python -m src.pipeline.1_data_retrieval

      # Create the run's release with the retrieval log, tagged data-<environment>-<date>-<short sha>-r<run number>.<attempt>, unique per run and re-run.
      - name: Create data release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          RUN="r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          TAG="data-${APP_ENV}-${DATE}-${GITHUB_SHA::7}-${RUN}"
          cp logs/pipeline.log logs/retrieval.log
          gh release create "$TAG" logs/retrieval.log \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${APP_ENV^} data — ${DATE} (${GITHUB_SHA::7}, run ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" \
            --notes "AAPL data for ${APP_ENV}, produced by commit ${{ github.sha }} on branch ${{ github.ref_name }}."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Data preprocessing: clean and label the raw data table into the clean data table.
  preprocess:
    needs: retrieve
    runs-on: ubuntu-24.04
    # Allow uploading release files and pulling the image.
    permissions:
      contents: write
      packages: read
    env:
      # Release created by the retrieve job.
      TAG: ${{ needs.retrieve.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run data preprocessing with the target environment's configs and the storage credentials, writing tables to storage and logs/ to the runner.
      - name: Run data preprocessing
        run: |
          mkdir -p logs
          docker run --rm -e APP_ENV=${{ env.APP_ENV }} -e STORAGE_BUCKET -e AWS_ENDPOINT_URL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION -u $(id -u):$(id -g) -v "$PWD/data":/app/data -v "$PWD/logs":/app/logs ${{ env.IMAGE }}:${{ github.sha }} python -m src.pipeline.2_data_preprocessing

      # Add the preprocessing log to the release.
      - name: Upload preprocessing log
        run: |
          cp logs/pipeline.log logs/preprocessing.log
          gh release upload "$TAG" logs/preprocessing.log --repo "${{ github.repository }}"

  # Feature engineering: build the feature table from the clean data table.
  features:
    needs: [retrieve, preprocess]
    runs-on: ubuntu-24.04
    # Allow uploading release files and pulling the image.
    permissions:
      contents: write
      packages: read
    env:
      # Release created by the retrieve job.
      TAG: ${{ needs.retrieve.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run feature engineering with the target environment's configs and the storage credentials, writing tables to storage and logs/ to the runner.
      - name: Run feature engineering
        run: |
          mkdir -p logs
          docker run --rm -e APP_ENV=${{ env.APP_ENV }} -e STORAGE_BUCKET -e AWS_ENDPOINT_URL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION -u $(id -u):$(id -g) -v "$PWD/data":/app/data -v "$PWD/logs":/app/logs ${{ env.IMAGE }}:${{ github.sha }} python -m src.pipeline.3_feature_engineering

      # Add the feature engineering log to the release.
      - name: Upload features log
        run: |
          cp logs/pipeline.log logs/features.log
          gh release upload "$TAG" logs/features.log --repo "${{ github.repository }}"

  # Data split: split the feature table in time order into the train, val and test tables.
  split:
    needs: [retrieve, features]
    runs-on: ubuntu-24.04
    # Allow uploading release files and pulling the image.
    permissions:
      contents: write
      packages: read
    env:
      # Release created by the retrieve job.
      TAG: ${{ needs.retrieve.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run the data split with the target environment's configs and the storage credentials, writing tables to storage and logs/ to the runner.
      - name: Run data split
        run: |
          mkdir -p logs
          docker run --rm -e APP_ENV=${{ env.APP_ENV }} -e STORAGE_BUCKET -e AWS_ENDPOINT_URL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION -u $(id -u):$(id -g) -v "$PWD/data":/app/data -v "$PWD/logs":/app/logs ${{ env.IMAGE }}:${{ github.sha }} python -m src.pipeline.4_data_split

      # Add the split log to the release.
      - name: Upload split log
        run: |
          cp logs/pipeline.log logs/split.log
          gh release upload "$TAG" logs/split.log --repo "${{ github.repository }}"

  # Training and evaluation: train every configured model on the split tables, score it on train, val and test,
  # log it to MLflow, write its metrics and predictions tables, and add the models to the same release.
  training-evaluation:
    needs: [retrieve, split]
    runs-on: ubuntu-24.04
    # Allow uploading release files and pulling the image.
    permissions:
      contents: write
      packages: read
    env:
      # Release created by the retrieve job.
      TAG: ${{ needs.retrieve.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # MLflow tracking server on DagsHub.
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Train and evaluate with the target environment's configs and the MLflow and storage credentials, writing data/, models/ and logs/ to the runner.
      - name: Train and evaluate models
        run: |
          mkdir -p models logs
          docker run --rm -e APP_ENV=${{ env.APP_ENV }} -e PIPELINE_RUN_ID -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME -e MLFLOW_TRACKING_PASSWORD -e STORAGE_BUCKET -e AWS_ENDPOINT_URL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION -e GITHUB_REF_NAME -e GITHUB_SHA -u $(id -u):$(id -g) -v "$PWD/data":/app/data -v "$PWD/models":/app/models -v "$PWD/logs":/app/logs ${{ env.IMAGE }}:${{ github.sha }} python -m src.pipeline.5_model_training_evaluation

      # Show this run's test metrics from the metrics table on the workflow run page.
      - name: Write job summary
        run: |
          docker run --rm -e APP_ENV=${{ env.APP_ENV }} -e PIPELINE_RUN_ID -e STORAGE_BUCKET -e AWS_ENDPOINT_URL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION ${{ env.IMAGE }}:${{ github.sha }} python -c "
          import os
          from utils.storage_io import StorageIO
          m = StorageIO().read(table = 'evaluation/metrics', all_runs = True)
          m = m[(m['run_id'] == os.environ['PIPELINE_RUN_ID']) & (m['split'] == 'test')].sort_values('f1', ascending = False)
          print('### Test set results\\n\\n| Model | F1 | Precision | Recall | MCC | ROC AUC | Accuracy |\\n|---|---|---|---|---|---|---|')
          [print(f'| {r.model} | {r.f1:.3f} | {r.precision:.3f} | {r.recall:.3f} | {r.mcc:.3f} | {r.roc_auc:.3f} | {r.accuracy:.3f} |') for r in m.itertuples()]
          " >> "$GITHUB_STEP_SUMMARY"

      # Add the trained models and log to the release.
      - name: Upload models
        run: |
          cp logs/pipeline.log logs/training_evaluation.log
          gh release upload "$TAG" models/*.joblib logs/training_evaluation.log --repo "${{ github.repository }}"

  # Model selection: pick the best model of this run by validation score from the metrics table, register it in MLflow
  # with the environment's alias, and add it to the same release.
  model-selection:
    needs: [retrieve, training-evaluation]
    runs-on: ubuntu-24.04
    # Allow uploading release files and pulling the image.
    permissions:
      contents: write
      packages: read
    env:
      # Release created by the retrieve job.
      TAG: ${{ needs.retrieve.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # MLflow tracking server on DagsHub.
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      # Log in to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Download the trained models from the release.
      - name: Download models
        run: gh release download "$TAG" --pattern "*.joblib" --dir models --repo "${{ github.repository }}"

      # Select and register the best model with the target environment's configs and the MLflow and storage credentials.
      - name: Select best model
        run: |
          mkdir -p logs
          docker run --rm -e APP_ENV=${{ env.APP_ENV }} -e MLFLOW_TRACKING_URI -e MLFLOW_TRACKING_USERNAME -e MLFLOW_TRACKING_PASSWORD -e STORAGE_BUCKET -e AWS_ENDPOINT_URL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION -u $(id -u):$(id -g) -v "$PWD/models":/app/models -v "$PWD/logs":/app/logs ${{ env.IMAGE }}:${{ github.sha }} python -m src.pipeline.6_model_selection

      # Add the best model and log to the release.
      - name: Upload best model
        run: |
          cp logs/pipeline.log logs/model_selection.log
          gh release upload "$TAG" models/best_model.joblib logs/model_selection.log --repo "${{ github.repository }}"
