input:
  raw_data: data/raw/apple_stock_raw.xlsx

imputation:
  volume_column: Volume
  price_columns: [Adj Close, Close, High, Low, Open]

daily_returns:
  price_column: Adj Close

extreme_events:
  threshold: 2

split:
  features: [Open, High, Low, Close, Volume, daily_return]
  target: extreme_event
  train_end: 0.7
  val_end: 0.85

output:
  dataset: apple_stock_data.xlsx
  training_set: training_set.xlsx
  validation_set: validation_set.xlsx
  test_set: test_set.xlsx
