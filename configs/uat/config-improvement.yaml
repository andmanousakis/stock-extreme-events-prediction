experiments:
  - name: baseline

  - name: class_weights
    training: {class_weights: true}

  - name: threshold
    training: {class_weights: true, tune_threshold: true}

  - name: volatility_features
    training: {class_weights: true, tune_threshold: true}
    features: [daily_return, volatility_5, volatility_10, volatility_20, range, gap, volume_ratio]

  - name: smaller_network
    training: {class_weights: true, tune_threshold: true, weight_decay: 0.0001, learning_rate: 0.0003}
    features: [daily_return, volatility_5, volatility_10, volatility_20, range, gap, volume_ratio]
    network: {channels: [8, 16], dropout: 0.5}

output:
  model: models/temporal_cnn_improved.joblib
  results: reports/improvement_results.csv
