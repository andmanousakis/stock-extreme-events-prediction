input:
  train: data/processed/splits/train.xlsx
  val: data/processed/splits/val.xlsx
  test: data/processed/splits/test.xlsx

features: [Open, High, Low, Close, Volume, daily_return]

target:
  column: extreme_event_next_day

window: 10

model:
  random_state: 42
  param_grid:
    n_estimators: [100, 300]
    max_depth: [3, 5, 10, null]
    min_samples_leaf: [1, 5, 20]
    class_weight: [null, balanced]

output:
  model: models/random_forest.joblib
